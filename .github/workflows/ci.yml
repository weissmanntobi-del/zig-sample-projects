name: Zig CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Check Zig Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.1"

      - name: Check formatting
        run: |
          zig fmt --check \
            01-production-ls \
            02-streaming-log-analyzer \
            03-generic-ring-buffer \
            04-concurrent-worker-pool \
            05-tcp-chat-server

  build-and-test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-production-ls
          - 02-streaming-log-analyzer
          - 03-generic-ring-buffer
          - 04-concurrent-worker-pool
          - 05-tcp-chat-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.1"

      - name: Show Zig version
        run: zig version

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: zig build

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: zig build
